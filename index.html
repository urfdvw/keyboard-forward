<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keyboard-forward</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    background: #1a1a1a;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
  }

  #sidebar {
    width: 240px;
    min-width: 240px;
    background: #242424;
    border-right: 1px solid #333;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  h1 { font-size: 16px; font-weight: 600; color: #fff; }

  .section { display: flex; flex-direction: column; gap: 8px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }

  button {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2e2e2e;
    color: #e0e0e0;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button.danger  { background: #dc2626; border-color: #dc2626; color: #fff; }
  button.danger:hover:not(:disabled)  { background: #b91c1c; }

  textarea {
    background: #1a1a1a;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    resize: vertical;
    width: 100%;
    min-height: 80px;
  }
  textarea:focus { outline: none; border-color: #666; }

  #status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #1a1a1a;
    font-size: 13px;
  }
  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #555;
  }
  #status-badge.idle #status-dot { background: #555; }
  #status-badge.adv  #status-dot { background: #f59e0b; }
  #status-badge.conn #status-dot { background: #22c55e; }
  #status-badge.disc #status-dot { background: #ef4444; }

  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #capture-indicator, #send-indicator {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #capture-indicator { color: #22c55e; }
  #send-indicator    { color: #2563eb; }
  #capture-indicator.active, #send-indicator.active { display: flex; }
  #capture-indicator .icon, #send-indicator .icon { font-size: 48px; animation: pulse 1.5s ease-in-out infinite; }
  #capture-indicator .label, #send-indicator .label { font-size: 13px; color: #666; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>keyboard-forward</h1>

  <div class="section">
    <div class="section-title">Connection</div>
    <button id="btn-connect" class="primary">Connect Serial</button>
    <button id="btn-pair" disabled>Pair BLE</button>
    <div id="status-badge" class="idle">
      <div id="status-dot"></div>
      <span id="status-text">Idle</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Keyboard</div>
    <button id="btn-capture" disabled>Start Capture</button>
  </div>

  <div class="section">
    <div class="section-title">Send Text</div>
    <textarea id="txt-send" placeholder="Type or paste ASCII text…"></textarea>
    <button id="btn-send" disabled>Send</button>
  </div>
</div>

<div id="main">
  <div id="capture-indicator">
    <div class="icon">⌨</div>
    <div class="label">Forwarding all keystrokes</div>
  </div>
  <div id="send-indicator">
    <div class="icon">📤</div>
    <div class="label">Sending text…</div>
  </div>
</div>

<script>
// ─── HID keycode maps ────────────────────────────────────────────────────────

const MOD_MAP = {
  ControlLeft: 0x01, ShiftLeft: 0x02, AltLeft: 0x04, MetaLeft: 0x08,
  ControlRight: 0x10, ShiftRight: 0x20, AltRight: 0x40, MetaRight: 0x80,
};

const KEY_MAP = {
  // Letters
  KeyA:0x04, KeyB:0x05, KeyC:0x06, KeyD:0x07, KeyE:0x08, KeyF:0x09,
  KeyG:0x0A, KeyH:0x0B, KeyI:0x0C, KeyJ:0x0D, KeyK:0x0E, KeyL:0x0F,
  KeyM:0x10, KeyN:0x11, KeyO:0x12, KeyP:0x13, KeyQ:0x14, KeyR:0x15,
  KeyS:0x16, KeyT:0x17, KeyU:0x18, KeyV:0x19, KeyW:0x1A, KeyX:0x1B,
  KeyY:0x1C, KeyZ:0x1D,
  // Digits (Digit0 = 0x27)
  Digit1:0x1E, Digit2:0x1F, Digit3:0x20, Digit4:0x21, Digit5:0x22,
  Digit6:0x23, Digit7:0x24, Digit8:0x25, Digit9:0x26, Digit0:0x27,
  // Special
  Enter:0x28, Escape:0x29, Backspace:0x2A, Tab:0x2B, Space:0x2C,
  // Punctuation (US QWERTY)
  Minus:0x2D, Equal:0x2E, BracketLeft:0x2F, BracketRight:0x30,
  Backslash:0x31, Semicolon:0x33, Quote:0x34, Backquote:0x35,
  Comma:0x36, Period:0x37, Slash:0x38,
  // Function keys + caps
  CapsLock:0x39,
  F1:0x3A, F2:0x3B, F3:0x3C, F4:0x3D, F5:0x3E, F6:0x3F,
  F7:0x40, F8:0x41, F9:0x42, F10:0x43, F11:0x44, F12:0x45,
  // Navigation
  Insert:0x49, Home:0x4A, PageUp:0x4B, Delete:0x4C,
  End:0x4D, PageDown:0x4E,
  ArrowRight:0x4F, ArrowLeft:0x50, ArrowDown:0x51, ArrowUp:0x52,
  // Numpad
  NumLock:0x53, NumpadDivide:0x54, NumpadMultiply:0x55,
  NumpadSubtract:0x56, NumpadAdd:0x57, NumpadEnter:0x58,
  Numpad1:0x59, Numpad2:0x5A, Numpad3:0x5B, Numpad4:0x5C,
  Numpad5:0x5D, Numpad6:0x5E, Numpad7:0x5F, Numpad8:0x60,
  Numpad9:0x61, Numpad0:0x62, NumpadDecimal:0x63,
  PrintScreen:0x46, ScrollLock:0x47, Pause:0x48,
};

// ASCII character → [hid_keycode, modifier_byte] for US QWERTY layout
const ASCII_MAP = (() => {
  const m = {};
  // a–z
  for (let i = 0; i < 26; i++) {
    m[String.fromCharCode(97 + i)] = [0x04 + i, 0x00];
    m[String.fromCharCode(65 + i)] = [0x04 + i, 0x02]; // A–Z need Left Shift
  }
  // digits
  [['1',0x1E],['2',0x1F],['3',0x20],['4',0x21],['5',0x22],
   ['6',0x23],['7',0x24],['8',0x25],['9',0x26],['0',0x27]]
    .forEach(([c,k]) => m[c] = [k, 0x00]);
  // whitespace
  m[' ']  = [0x2C, 0x00];
  m['\n'] = [0x28, 0x00];
  m['\t'] = [0x2B, 0x00];
  // unshifted punctuation
  [['-',0x2D],['=',0x2E],['[',0x2F],[']',0x30],['\\',0x31],
   [';',0x33],["'",0x34],['`',0x35],[',',0x36],['.',0x37],['/',0x38]]
    .forEach(([c,k]) => m[c] = [k, 0x00]);
  // shifted punctuation
  [['!',0x1E],['@',0x1F],['#',0x20],['$',0x21],['%',0x22],
   ['^',0x23],['&',0x24],['*',0x25],['(',0x26],[')',0x27],
   ['_',0x2D],['+',0x2E],['{',0x2F],['}',0x30],['|',0x31],
   [':',0x33],['"',0x34],['~',0x35],['<',0x36],['>',0x37],['?',0x38]]
    .forEach(([c,k]) => m[c] = [k, 0x02]);
  return m;
})();

// ─── Serial state ────────────────────────────────────────────────────────────

let port   = null;
let writer = null;

// ─── Capture state ───────────────────────────────────────────────────────────

let capturing  = false;
let currentMod = 0;

// ─── Protocol helpers ────────────────────────────────────────────────────────

function sendBytes(arr) {
  if (!writer) return;
  writer.write(new Uint8Array(arr)).catch(() => {});
}

function sendKeyDown(mod, kc) { sendBytes([0x03, mod, kc]); }
function sendKeyUp(mod, kc)   { sendBytes([0x04, mod, kc]); }
function sendReleaseAll()      { sendBytes([0x05]); }
function sendAdvertise()       { sendBytes([0x01]); }

// ─── Capture toggle ──────────────────────────────────────────────────────────

const btnCapture       = document.getElementById('btn-capture');
const captureIndicator = document.getElementById('capture-indicator');

function setCapturing(on) {
  capturing = on;
  if (on) {
    btnCapture.textContent = 'Stop Capture';
    btnCapture.classList.add('danger');
    captureIndicator.classList.add('active');
    currentMod = 0;
  } else {
    sendReleaseAll();
    currentMod = 0;
    btnCapture.textContent = 'Start Capture';
    btnCapture.classList.remove('danger');
    captureIndicator.classList.remove('active');
  }
}

btnCapture.addEventListener('click', () => setCapturing(!capturing));

// ─── Global keyboard capture ──────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (!capturing) return;
  // Don't intercept typing in the send-text area
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  e.preventDefault();

  const modBit = MOD_MAP[e.code];
  if (modBit) {
    currentMod |= modBit;
    sendKeyDown(currentMod, 0x00);
    return;
  }
  const kc = KEY_MAP[e.code];
  if (kc) sendKeyDown(currentMod, kc);
});

document.addEventListener('keyup', e => {
  if (!capturing) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  e.preventDefault();

  const modBit = MOD_MAP[e.code];
  if (modBit) {
    currentMod &= ~modBit & 0xFF;
    sendKeyUp(currentMod, 0x00);
    return;
  }
  const kc = KEY_MAP[e.code];
  if (kc) sendKeyUp(currentMod, kc);
});

// ─── Send text ───────────────────────────────────────────────────────────────

const btnSend      = document.getElementById('btn-send');
const txtSend      = document.getElementById('txt-send');
const sendIndicator = document.getElementById('send-indicator');

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

btnSend.addEventListener('click', async () => {
  if (!writer) return;
  if (capturing) setCapturing(false); // stop capture before sending
  btnSend.disabled = true;
  sendIndicator.classList.add('active');
  const text = txtSend.value;
  for (const ch of text) {
    if (ch === '\r') continue; // skip bare CR; \n handles line breaks
    const entry = ASCII_MAP[ch];
    if (!entry) continue; // skip unsupported characters
    const [kc, mod] = entry;
    sendKeyDown(mod, kc);
    await sleep(30);
    sendKeyUp(0x00, kc); // release key and clear modifier
    await sleep(20);
  }
  sendIndicator.classList.remove('active');
  // Re-enable only if BLE is still connected
  if (!btnCapture.disabled) btnSend.disabled = false;
});

// ─── Status display ──────────────────────────────────────────────────────────

const badge      = document.getElementById('status-badge');
const statusText = document.getElementById('status-text');

function setStatus(cls, text) {
  badge.className = cls;
  statusText.textContent = text;
}

function handleStatusLine(line) {
  line = line.trim();
  if (line === 'IDLE')       setStatus('idle', 'Idle');
  else if (line === 'ADV')   setStatus('adv', 'Advertising…');
  else if (line === 'DISC') {
    setStatus('disc', 'Disconnected');
    setCapturing(false);
    btnCapture.disabled = true;
    btnSend.disabled = true;
  } else if (line.startsWith('CONN:')) {
    const name = line.slice(5) || 'Unknown';
    setStatus('conn', 'Connected: ' + name);
    btnCapture.disabled = false;
    btnSend.disabled = false;
  }
}

// ─── Serial connection ────────────────────────────────────────────────────────

const btnConnect = document.getElementById('btn-connect');
const btnPair    = document.getElementById('btn-pair');

btnConnect.addEventListener('click', connectSerial);
btnPair.addEventListener('click', () => sendAdvertise());

async function connectSerial() {
  if (!('serial' in navigator)) {
    alert('Web Serial not supported. Use Chrome or Edge.');
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    btnConnect.disabled = true;
    btnPair.disabled = false;
    setStatus('idle', 'Idle');
    readLoop();
  } catch (e) {
    console.error(e);
  }
}

async function readLoop() {
  const decoder = new TextDecoder();
  let buf = '';
  try {
    const reader = port.readable.getReader();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.trim()) handleStatusLine(line);
      }
    }
  } catch (e) {
    console.error(e);
  }
  setCapturing(false);
  btnConnect.disabled = false;
  btnPair.disabled = true;
  btnCapture.disabled = true;
  btnSend.disabled = true;
  setStatus('disc', 'Serial disconnected');
}
</script>
</body>
</html>
